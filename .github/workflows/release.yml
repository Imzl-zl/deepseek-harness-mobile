# 发版：推送 `v*` 标签时构建两个产物并挂到 GitHub Release。
#
#   connector → dsh-mobile-connector-<version>.tgz（DSH 插件包）
#   app       → dsh-mobile-<tag>.apk（有签名 Secrets 就签，没有就是 debug 签名）
#
# 签名密钥怎么生成、Secrets 叫什么，见 docs/cookbook/release.md。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  connector:
    name: connector / tgz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: connector/pnpm-lock.yaml
      - name: 构建并打包
        working-directory: connector
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm build
          pnpm pack
      - uses: softprops/action-gh-release@v2
        with:
          files: connector/*.tgz
          generate_release_notes: true

  android:
    name: app / apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      # 有密钥就签；没有就什么都不做，gradle 会退到 debug 签名（release 构建照样能装）。
      # 注意：`secrets` 不能写进 `if:`，所以用 shell 判断（见 docs/cookbook/release.md）。
      - name: 写入签名配置（可选）
        working-directory: app/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "没有 ANDROID_KEYSTORE_BASE64：本次用 debug 签名"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > app/release.jks
          cat > key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF

      - name: 构建 APK
        working-directory: app
        run: |
          flutter pub get
          # **按 ABI 拆开**：通用包会把三份 Flutter 引擎都塞进同一个文件
          # （v0.2.15 实测 75.14 MB），而每台手机只需要其中一份。
          # 取舍与「该下哪个」见 docs/cookbook/release.md §3。
          flutter build apk --release --split-per-abi \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=APP_VERSION="${GITHUB_REF_NAME#v}"

      - name: 收集产物
        run: |
          mkdir -p out
          # 三个 ABI 一个都不能少：缺哪个就当场红，而不是发一个少一个包的版本。
          # （`flutter build apk --split-per-abi` 的产物名是 Flutter 定的，
          # 不是我们起的 —— 对着 `flutter --version` 锁的 3.41.9 写死三个，
          # 升级 Flutter 后这里红了就说明产物名变了。）
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="app/build/app/outputs/flutter-apk/app-${abi}-release.apk"
            if [ ! -f "$src" ]; then
              echo "缺少产物：$src" >&2
              ls -l app/build/app/outputs/flutter-apk/ >&2
              exit 1
            fi
            cp "$src" "out/dsh-mobile-${GITHUB_REF_NAME}-${abi}.apk"
          done
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
