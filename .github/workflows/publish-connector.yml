# 发布插件到 npm：推 `connector-v*` 标签，或手动 workflow_dispatch。
#
# 两条路径：
# - **首次发布**（bootstrap）：npm 的可信发布不能发新包的第一个版本（npm/cli#8544），
#   所以要一次性 NPM_TOKEN（Classic Automation，用完即撤）。
# - **之后**：包上配了 Trusted Publisher 就什么都不用，走 OIDC + provenance。
name: publish-connector

on:
  push:
    tags: ['connector-v*']
  workflow_dispatch:

permissions:
  contents: read
  # 可信发布 / provenance：npm CLI 用 GitHub 的 OIDC 换短期凭据。
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: connector/pnpm-lock.yaml

      - name: 构建并自检
        working-directory: connector
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm build

      - name: 标签与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: connector
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#connector-v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "package.json 的 $VERSION 与标签 $TAG 不一致：先改版本再打标签"
            exit 1
          fi

      - name: 发布到 npm
        working-directory: connector
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
            echo "路径：一次性 token（首次 bootstrap）"
          else
            echo "路径：可信发布（OIDC）—— 需要包上已配 Trusted Publisher"
          fi
          # `--provenance` 两种路径都成立：仓库是公开的，OIDC 可用。
          npm publish --access public --provenance
