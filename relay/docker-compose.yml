# 中转的容器编排（本机与服务器同一份）。
#
# 用法：
#   cp relay.config.example.json relay.config.json   # 改成自己的令牌摘要
#   docker compose up -d --build
#   docker compose ps                                # 等 healthy
#   docker compose logs -f relay
#
# ## 公网部署要 TLS（这一条不是可选项）
#
# 手机对**非私网**地址强制 `wss://`（`app/lib/core/endpoint.dart` 的
# `isPrivateOrLoopback`），而中转自己**不终结 TLS**（设计见
# `docs/subsystems/connector-and-relay.md`）。所以公网只有两条路：
#   ① 打开下面那段 `caddy`（自动签证书，一条 A 记录就够）；
#   ② 用现成的反代 / `tailscale serve` 把 TLS 终结掉，再指到本服务的 8787。
services:
  relay:
    # **上下文是仓库根**：relay/src 复用 `../../protocol/relay-control.mjs`，
    # 镜像里的相对层级必须与仓库一致（见 relay/Dockerfile 的说明）。
    build:
      context: ..
      dockerfile: relay/Dockerfile
    image: dsh-mobile-relay:local
    # **炸了别无限重启**：配置写错（JSON 坏、端口被占）是"每次都立刻退"的形状，
    # `unless-stopped` 会把它变成一台永远在重启的容器（刷日志、吃 CPU）。
    # 五次都没起来就停在那里，等人看日志。
    restart: on-failure:5
    # **日志要封顶**：Docker 默认 json-file 无上限，一个被刷的端口能把宿主磁盘写满 ——
    # 那是最常见的"容器把服务器拖垮"。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # **资源上限**：泄漏或洪水先在容器里炸，别把宿主机拖下水。
    # 中转只转发与记账（进程内表 + 几条长连接），256M / 1 核足够。
    mem_limit: 256m
    cpus: 1.0
    ports:
      # **公网部署请绑 127.0.0.1**：`"8787:8787"` 会把中转直接挂到公网 ——
      # 明文 http/ws 上，连接器令牌（`Authorization: Bearer`）对链路上的任何人都可见，
      # 拿到它就能替你的电脑向中转报名册。柜台（Caddy）终结 TLS 之后再用这一行。
      - "8787:8787"
    volumes:
      # **读写**挂载：`--issue-token` / `--revoke-token` 会改这份文件。
      # 只读部署（令牌在别处签发）可以加 `:ro`。
      - ./relay.config.json:/config/relay.config.json
    environment:
      # 必须与 relay.config.json 的 `port` 一致：镜像的健康检查按它连端口。
      RELAY_PORT: "8787"

  # ---- 公网 TLS（可选，二选一里的 ①）----
