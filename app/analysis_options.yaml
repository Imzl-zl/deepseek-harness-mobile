# 静态分析与 lint（`flutter analyze` / `dart analyze` 读它）。
#
# 基线是 `package:flutter_lints/flutter.yaml`（Flutter 官方推荐集），
# 下面额外打开的规则针对本项目的**具体失败模式**，不是"更严格就好"：
#
# - `avoid_dynamic_calls` / `always_declare_return_types`：协议层最怕"类型悄悄变成
#   `dynamic`"—— JSON 解析出来的东西一旦漏成 dynamic，AAD 拼串写错也不报错
#   （症状是"解不开"而不是"编译失败"）。
# - `unawaited_futures` / `discarded_futures`：本层几乎全是 async（AEAD / HKDF / 密钥派生），
#   漏一个 `await` 会让"派生还没完成就用结果"，而那种竞态在单测里时快时慢。
# - `prefer_final_locals` / `omit_local_variable_types` / `prefer_single_quotes` /
#   `directives_ordering`：与 `dart format` 配套的声明风格（社区默认写法）。
#
# **`public_member_api_docs` 刻意不开**（实测过，不是"懒得加"）：
# 它是**发布到 pub.dev 的包**才需要的规则（本工程 `publish_to: 'none'`，是 App 不是包），
# 而它无法只对"函数与类型"生效 —— 一开就会连带要求 66 处**字段/构造器/枚举值**注释，
# 那些只能是复述名字的噪音，反而会把真正重要的协议语义注释淹没。
# 现状是：`lib/core/` 里**每一个函数与类型声明都已有文档**（这是靠 review 维持的，
# 也是根 `AGENTS.md` §4 要求的"非平凡改动留笔记"的自然结果）。
include: package:flutter_lints/flutter.yaml

analyzer:
  # 把 info 也当失败：与 CI 的 `dart analyze --fatal-infos` 口径一致，
  # 本地就不必记"哪些 info 可以忽略"。
  errors:
    todo: ignore # TODO 允许（决策笔记里会跟），但不该拦住构建
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # ---- 声明风格（与 dart format 配套）----
    prefer_final_locals: true
    omit_local_variable_types: true
    always_declare_return_types: true
    prefer_single_quotes: true
    sort_constructors_first: true
    directives_ordering: true

    # ---- 协议层的类型安全 ----
    avoid_dynamic_calls: true

    # ---- async 正确性 ----
    unawaited_futures: true
    avoid_void_async: true
    discarded_futures: true
    unnecessary_await_in_return: true

    # ---- 常见坑（社区高频）----
    prefer_const_constructors: true
    prefer_const_declarations: true
    avoid_print: true
    only_throw_errors: true
    throw_in_finally: true
